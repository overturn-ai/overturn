<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overturn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="status" id="status">Waiting for a draft</div>
<div class="note" id="order"></div>
<div class="note" id="banner"></div>
<textarea class="reason" id="draft" rows="4" placeholder="Paste the AI draft here, then mark it as the draft"></textarea>

<div class="quick" id="reasons"></div>
<input class="reason" id="note" type="text" placeholder="Why did you change it? (optional note)">
<script src="main.js"></script>
</body>
</html>
