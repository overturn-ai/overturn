name: Sentry → fix PR

# Sentry alert → webhook (repository_dispatch, event_type `sentry_issue`) → agent reads the trace → fix PR in <10 min → human approves.
# Set up in Sentry: Alerts → create alert → action "Send a notification via an integration" → GitHub repository_dispatch (or an internal integration posting to
# https://api.github.com/repos/<owner>/<repo>/dispatches with {"event_type":"sentry_issue","client_payload":{"issue_url":"<url>","issue_id":"<id>"}}).
on:
  repository_dispatch:
    types: [sentry_issue]
  workflow_dispatch:
    inputs:
      issue_url:
        description: Sentry issue URL
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          git config user.name "Shireen Kadhium"
          git config user.email "shireenkadhium1@gmail.com"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--model claude-opus-5-5 --max-turns 80"
          prompt: |
            Sentry issue: ${{ github.event.client_payload.issue_url || inputs.issue_url }}
            Fetch it with the Sentry API (token in $SENTRY_AUTH_TOKEN, org/project in CLAUDE.md). Follow .claude/skills/bug-fix-pr/SKILL.md exactly: failing test first, smallest fix, PR titled `fix: <symptom> (SENTRY-<id>)`, label `agent-fix`, author Shireen Kadhium <shireenkadhium1@gmail.com>, no trailers. Ten-minute budget; past it, open a draft with findings and stop.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
