name: CI

on:
  push:
    # Agent branches test on push. A PR opened by github-actions[bot] has its
    # workflows held for approval, so the required check never arrives and the
    # PR cannot merge. Pushing the branch runs the same job on the same commit,
    # which satisfies the check. Fork PRs are untouched and stay gated — this
    # only ever fires for branches already inside the repo.
    branches: [main, 'agent/**', 'chore/**', 'fix/sentry-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Attribution and agent guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole range back to main has to be here, or there is nothing to walk. On a
          # pull_request event, check out the branch itself rather than the merge commit
          # GitHub synthesises, which is authored by GitHub and would fail its own check.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Every commit is Shireen's, with no agent trailers
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=200 --quiet || true
          bash scripts/check-attribution.sh "$BASE"
      - name: Both checks still fail on the things they exist to catch
        run: |
          bash .claude/hooks/git-guard.test.sh
          bash scripts/check-attribution.test.sh

  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: overturn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/overturn_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/overturn_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm setup:python
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @overturn-ai/web exec playwright install --with-deps chromium
      - run: pnpm test

  quickstart:
    name: README quickstart from a fresh clone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the script clones this checkout; shallow repos cannot be cloned
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres bash scripts/quickstart-check.sh
